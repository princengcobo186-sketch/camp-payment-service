# Quality gate for every pull request. Needs no cloud credentials, so it is safe on forks.
# Image build and push to ECR is a separate, credentialed workflow added in Phase 2.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Tool versions come from .tool-versions, the same file developers use locally.
      - uses: asdf-vm/actions/setup@b7bcd026f18772e44fe1026d729e1611cc435d47 # v4.0.1
      - uses: asdf-vm/actions/install@b7bcd026f18772e44fe1026d729e1611cc435d47 # v4.0.1

      - run: make sync
      - run: make lint
      - run: make test

  chart:
    name: Chart
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: asdf-vm/actions/setup@b7bcd026f18772e44fe1026d729e1611cc435d47 # v4.0.1
      - uses: asdf-vm/actions/install@b7bcd026f18772e44fe1026d729e1611cc435d47 # v4.0.1
      - run: make chart-check

  image:
    name: Image builds
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Build only. Proves the Dockerfile works on every PR; nothing is pushed.
      - run: docker build -t camp/payment-service:ci .
      - name: container runs as non-root and fails closed without config
        run: |
          uid="$(docker run --rm --entrypoint id camp/payment-service:ci -u)"
          [ "${uid}" = "10001" ] || { echo "expected uid 10001, got ${uid}" >&2; exit 1; }
          if docker run --rm camp/payment-service:ci > /dev/null 2>&1; then
            echo "container started without APP_ENV" >&2; exit 1
          fi
